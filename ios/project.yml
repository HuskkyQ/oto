name: TeslaMateViewer

options:
  bundleIdPrefix: com.sevan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  TeslaMateViewer:
    type: application
    platform: iOS
    sources:
      - path: TeslaMateViewer
    # Generated by XcodeGen: INFOPLIST_KEY_* only carries keys Xcode knows, so the
    # ProMotion opt-in has to live in a real plist.
    info:
      path: TeslaMateViewer/Info.plist
      properties:
        CFBundleDisplayName: Oto
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 连接局域网内的自建 API 读取车辆数据。
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sevan.TeslaMateViewer
        PRODUCT_NAME: TeslaMate
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - TeslaMateViewerTests

  TeslaMateViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TeslaMateViewerTests
    dependencies:
      - target: TeslaMateViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sevan.TeslaMateViewerTests
        GENERATE_INFOPLIST_FILE: YES
        # The app's PRODUCT_NAME is TeslaMate, so XcodeGen's default test host misses.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TeslaMate.app/TeslaMate"
        BUNDLE_LOADER: "$(TEST_HOST)"
